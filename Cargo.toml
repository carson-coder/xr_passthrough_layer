[package]
name = "xr_passthrough_layer"
description = "impl of XR_FB_passthrough as an API layer"
authors = ["Yuxuan Shui <yshuiv7@gmail.com>"]
repository = "https://github.com/yshui/xr_passthrough_layer"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace]
members = [ "thirdparty/quark", "thirdparty/quark/proc-macros" ]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = { version = "1.0.45", features = ["backtrace"] }
ash = "0.38.0"
vulkano = "0.35.0"
vulkano-shaders = "0.35.0"
image = "0.25.1"
ctrlc = "3.2.1"
log = "0.4.14"
env_logger = "0.11.3"
v4l = "0.14.0"
udev = "0.9.3"
thiserror = "2.0.11"
renderdoc = "0.12.1"
nalgebra = "0.33.2"
itertools = "0.14.0"
config = "0.15.8"
serde = { version = "1.0.130", features = ["derive"] }
argh = "0.1.6"
serde_json = "1.0.70"
xdg = "2.4.0"
toml = "0.8.8"
humantime-serde = "1.0.1"
bytemuck = { version = "^1.7", features = ["derive"] }
libloading = "0.8.0"
openxr = { version = "0.19.0" }
smallvec = "1.11.2"
quark = { path = "thirdparty/quark" }
glam = "0.30.0"
ed25519-dalek = "2.1.1"
rand = "0.9.0"
winit = "0.30.9"
arc-swap = "1.7.1"

[build-dependencies]
anyhow = "1.0.45"
shaderc = "0.8.0"
