[package]
name = "proc-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.40"
heck = "0.5.0"
proc-macro2 = { version = "1.0.94", features = ["proc-macro"] }
quick-xml = { version = "0.37.2", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
phf = { version = "0.11.3", features = ["macros"] }
